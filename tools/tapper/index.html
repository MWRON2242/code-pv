<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打点器 · 代码渲染 PV 的地基</title>
<style>
  :root{
    --bg:#010409; --panel:#0d1117; --line:#21262d; --fg:#e6edf3; --dim:#7d8590;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  header{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1{font-size:14px; margin:0 8px 0 0; font-weight:600; letter-spacing:.5px}
  header .sp{flex:1}

  button, .fbtn, select, input[type=file]::file-selector-button{
    background:#21262d; color:var(--fg); border:1px solid #30363d;
    border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer;
    font-family:inherit;
  }
  button:hover, .fbtn:hover{background:#30363d}
  .fbtn{display:inline-flex; align-items:center}
  .fbtn input{display:none}

  #stage{flex:1; display:flex; flex-direction:column; min-height:0; position:relative}
  #stage.over::after{
    content:"松手就载入"; position:absolute; inset:0; z-index:9;
    display:flex; align-items:center; justify-content:center;
    background:rgba(31,111,235,.18); border:2px dashed #1f6feb;
    font-size:18px; pointer-events:none;
  }

  #waveWrap{height:190px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line)}
  #wave{width:100%; height:100%; display:block; cursor:crosshair}

  .bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px 14px; border-bottom:1px solid var(--line);
  }
  .bar label{display:flex; align-items:center; gap:6px; color:var(--dim); font-size:13px}
  input[type=range]{width:150px; accent-color:#1f6feb}

  #typeBar{display:flex; gap:8px; padding:8px 14px; border-bottom:1px solid var(--line)}
  .typeBtn{background:transparent}
  kbd{
    font:11px/1 ui-monospace,Consolas,monospace; background:#30363d;
    padding:3px 5px; border-radius:4px; margin-right:4px;
  }
  #curType{font-weight:600}

  #hud{
    display:flex; gap:18px; align-items:baseline; flex-wrap:wrap;
    padding:6px 14px; color:var(--dim); font-size:12px;
    font-family:ui-monospace,Consolas,monospace;
  }
  #curTime{font-size:20px; color:var(--fg); font-family:ui-monospace,Consolas,monospace}

  #list{flex:1; overflow:auto; padding:6px 14px 40px}
  .row{
    display:flex; align-items:center; gap:10px; padding:5px 8px;
    border-radius:6px; cursor:pointer; border:1px solid transparent;
  }
  .row:hover{background:#161b22}
  .row.sel{background:#161b22; border-color:#1f6feb}
  .idx{width:28px; text-align:right; color:var(--dim); font-family:ui-monospace,Consolas,monospace; font-size:12px}
  .badge{border:none; border-radius:4px; color:#0d1117; font-size:11px; font-weight:700; padding:2px 8px; cursor:pointer}
  .tm{width:180px; color:#a5d6ff; font-family:ui-monospace,Consolas,monospace; font-size:12px}
  .label{
    flex:1; background:transparent; border:1px solid transparent; color:var(--fg);
    padding:3px 6px; border-radius:4px; font:inherit; font-size:13px; min-width:80px;
  }
  .label:focus{outline:none; border-color:#30363d; background:#0d1117}
  .empty{color:var(--dim); padding:24px 4px; font-size:13px}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px);
    background:#1f6feb; color:#fff; padding:8px 18px; border-radius:20px;
    font-size:13px; opacity:0; pointer-events:none; transition:.22s;
  }
  #toast.show{opacity:1; transform:translate(-50%,0)}
  .hint{color:var(--dim); font-size:12px}
</style>
</head>
<body>

<header>
  <h1>打点器</h1>
  <label class="fbtn">选择歌曲<input id="file" type="file" accept="audio/*"></label>
  <span id="songName" class="hint">未载入</span>
  <span class="sp"></span>
  <label class="hint">帧率
    <select id="fps">
      <option value="24" selected>24</option>
      <option value="25">25</option>
      <option value="30">30</option>
      <option value="60">60</option>
    </select>
  </label>
  <label class="fbtn">导入标注<input id="importFile" type="file" accept=".json,application/json"></label>
  <button id="exportBtn">导出 markers.json</button>
</header>

<div id="stage">
  <div id="waveWrap"><canvas id="wave"></canvas></div>

  <div class="bar">
    <button id="playBtn">▶ 播放</button>
    <span class="hint">空格播放/暂停 · 1/2/3/4 打点 · ←→ 微调 1 帧 · Shift+←→ 1 秒 · 退格删除 · Ctrl+Z 撤销</span>
    <span class="sp" style="flex:1"></span>
    <label>缩放 <input id="zoom" type="range" min="1" max="40" step="0.5" value="1"></label>
    <label><input id="follow" type="checkbox" checked> 跟随播放</label>
  </div>

  <div id="typeBar">当前笔：<span id="curType"></span></div>

  <div id="hud">
    <span id="curTime">00:00.000</span>
    <span id="curFrame">第 0 帧</span>
    <span>总长 <b id="totalTime">--:--.---</b></span>
    <span id="counts"></span>
  </div>

  <div id="list"></div>
</div>

<div id="toast"></div>

<script src="tapper.js"></script>
</body>
</html>
